name: Local shell timeout verification
on:
  push:
    branches: [verify/local-shell-timeout-runtime]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to verify
        required: true
        default: 3f2460333e24a1b15857c2e172c6c191cdbcc690
      expected:
        description: Expected timeout behavior
        type: choice
        options: [baseline, candidate]
        default: baseline
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_ref || '3f2460333e24a1b15857c2e172c6c191cdbcc690' }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Make existing shell fixtures available on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\usr\bin'
      - name: Install frozen dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        working-directory: source
        run: pnpm build
      - name: Real public API process proof
        working-directory: source
        env:
          PROOF_EXPECTED: ${{ inputs.expected || 'baseline' }}
        run: node ../harness/scripts/verify-local-shell-timeout.mjs . ${{ inputs.expected || 'baseline' }}
      - name: Full project tests including formatting and lint
        working-directory: source
        run: pnpm test
      - name: Independent typecheck
        working-directory: source
        run: pnpm typecheck
      - name: README and source spelling
        if: runner.os == 'Linux' && matrix.node == '24.x'
        working-directory: source
        run: |
          python -m pip install codespell
          python -m codespell -I .codespellignore README.md libs